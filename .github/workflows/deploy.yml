name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write # crear GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.id.outputs.release_id }}
      tag: ${{ steps.id.outputs.tag }}
      tarball_url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: id
        run: |
          REL="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "release_id=${REL}" >> "$GITHUB_OUTPUT"
          echo "tag=deploy-${REL}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (standalone)
        run: npm run build
        env:
          DATABASE_URL: mysql://build:build@localhost:9999/build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Crear wrapper server.js para Passenger
        run: |
          cat > server.js << 'WRAPPER'
          // Wrapper que Passenger ejecuta. Carga .env, fija NODE_ENV y delega
          // al server.js real del standalone build de Next.
          const fs = require('fs')
          const path = require('path')

          const envFile = path.join(__dirname, '.env')
          if (fs.existsSync(envFile)) {
            for (const line of fs.readFileSync(envFile, 'utf8').split('\n')) {
              const t = line.trim()
              if (!t || t.startsWith('#')) continue
              const m = t.match(/^([A-Z0-9_]+)=(.*)$/i)
              if (!m) continue
              let [, k, v] = m
              if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
                v = v.slice(1, -1)
              }
              if (!process.env[k]) process.env[k] = v
            }
          }
          process.env.NODE_ENV = process.env.NODE_ENV || 'production'
          require(path.join(__dirname, '.next', 'standalone', 'server.js'))
          WRAPPER

      - name: Empaquetar tarball precompilado
        env:
          REL: ${{ steps.id.outputs.release_id }}
        run: |
          # node_modules y static dentro del standalone para que server.js
          # encuentre Prisma client + assets en runtime.
          cp -r node_modules .next/standalone/node_modules
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          mkdir -p out
          tar -czf "out/${REL}.tar.gz" \
            .next \
            prisma \
            deploy \
            package.json \
            package-lock.json \
            server.js
          ls -lh out/

      - name: Crear GitHub Release con el tarball
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.id.outputs.tag }}
          REL: ${{ steps.id.outputs.release_id }}
        run: |
          gh release create "${TAG}" "out/${REL}.tar.gz" \
            --title "Deploy ${REL}" \
            --notes "Auto-deploy desde ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${REL}.tar.gz"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Tarball: ${URL}"

  notify-webhook:
    needs: build
    if: ${{ vars.DEPLOY_MODE == 'webhook' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
          REL: ${{ needs.build.outputs.release_id }}
          TAG: ${{ needs.build.outputs.tag }}
          URL: ${{ needs.build.outputs.tarball_url }}
        run: |
          BODY=$(printf '{"releaseId":"%s","tag":"%s","tarballUrl":"%s","commit":"%s"}' \
            "${REL}" "${TAG}" "${URL}" "${GITHUB_SHA}")
          SIG=$(printf '%s' "${BODY}" | openssl dgst -sha256 -hmac "${DEPLOY_HOOK_SECRET}" -hex | sed 's/^.* //')
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "${DEPLOY_HOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Signature: ${SIG}" \
            --data "${BODY}")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -1)
          echo "Response: $body"
          echo "HTTP: $code"
          [ "$code" = "200" ] || exit 1

      - name: Esperar 90s + health check
        run: |
          sleep 90
          for i in 1 2 3 4 5; do
            status=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" https://donot.cl/api/health || echo 000)
            if [ "$status" = "200" ]; then
              echo "✅  Health OK"
              curl -s https://donot.cl/api/health
              exit 0
            fi
            sleep 30
          done
          exit 1
