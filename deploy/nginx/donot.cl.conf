###
# /etc/nginx/sites-available/donot.cl
# Habilita con:
#   sudo ln -s /etc/nginx/sites-available/donot.cl /etc/nginx/sites-enabled/donot.cl
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después de instalar SSL con certbot, este archivo lo edita certbot
# automáticamente para sumar los `ssl_certificate*` y forzar redirect 80→443.
###

# 1) HTTP → HTTPS y challenge de Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name donot.cl www.donot.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2) HTTPS — proxy a Next.js (PM2 escucha en 127.0.0.1:3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name donot.cl www.donot.cl;

    # Estos paths los crea certbot:
    # ssl_certificate     /etc/letsencrypt/live/donot.cl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/donot.cl/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www → apex
    if ($host = www.donot.cl) {
        return 301 https://donot.cl$request_uri;
    }

    # Tamaño máximo del body (uploads de imagen → 5 MB del endpoint).
    client_max_body_size 8m;

    # Logs separados.
    access_log /var/log/nginx/donot-access.log;
    error_log  /var/log/nginx/donot-error.log warn;

    # Compresión.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/x-javascript
        application/xml application/rss+xml application/atom+xml
        image/svg+xml;
    gzip_min_length 1024;

    # Imágenes y assets cacheables.
    location ~* ^/(brand|menu|uploads)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Frame-Options "DENY" always;
    }

    # Next static (hashes de webpack, ya cacheables eternamente).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Resto de la app a Next/PM2.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }
}
