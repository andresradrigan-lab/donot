name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_PORT: '65002'

jobs:
  # Estrategia híbrida: si DEPLOY_HOOK_URL está configurado, usamos
  # pull-based (webhook al app); si no, fallback a push SSH.
  notify:
    if: ${{ vars.DEPLOY_MODE == 'webhook' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Llamar al deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_HOOK_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          BODY=$(printf '{"ref":"origin/main","commit":"%s"}' "${GITHUB_SHA}")
          SIG=$(printf '%s' "${BODY}" | openssl dgst -sha256 -hmac "${DEPLOY_HOOK_SECRET}" -hex | sed 's/^.* //')
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "${DEPLOY_HOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Signature: ${SIG}" \
            --data "${BODY}")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -1)
          echo "Response: $body"
          echo "HTTP: $code"
          if [ "$code" != "200" ]; then exit 1; fi

      - name: Esperar 90s y verificar health
        run: |
          sleep 90
          for i in 1 2 3 4 5; do
            status=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" https://donot.cl/api/health || echo 000)
            if [ "$status" = "200" ]; then
              echo "✅  Health OK"
              exit 0
            fi
            sleep 30
          done
          exit 1

  push-deploy:
    if: ${{ vars.DEPLOY_MODE != 'webhook' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: id
        run: echo "release_id=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (standalone)
        run: npm run build
        env:
          DATABASE_URL: mysql://build:build@localhost:9999/build

      - name: Empaquetar release (tar.gz)
        env:
          REL: ${{ steps.id.outputs.release_id }}
        run: |
          mkdir -p out
          tar -czf "out/${REL}.tar.gz" \
            .next public prisma deploy node_modules lib \
            ecosystem.config.js package.json package-lock.json tsconfig.json
          ls -lh out/

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} -H "$HOST" >> ~/.ssh/known_hosts

      - name: Subir + descomprimir
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ steps.id.outputs.release_id }}
        run: |
          ssh -p ${{ env.DEPLOY_PORT }} ${USER}@${HOST} "mkdir -p \$HOME/donot-platform/releases/${REL}"
          scp -P ${{ env.DEPLOY_PORT }} "out/${REL}.tar.gz" "${USER}@${HOST}:donot-platform/releases/${REL}.tar.gz"
          ssh -p ${{ env.DEPLOY_PORT }} ${USER}@${HOST} \
            "tar -xzf \$HOME/donot-platform/releases/${REL}.tar.gz -C \$HOME/donot-platform/releases/${REL}/ && rm \$HOME/donot-platform/releases/${REL}.tar.gz"

      - name: Activar release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ steps.id.outputs.release_id }}
        run: |
          ssh -p ${{ env.DEPLOY_PORT }} ${USER}@${HOST} \
            "bash \$HOME/donot-platform/releases/${REL}/deploy/scripts/release.sh \$HOME/donot-platform/releases/${REL}"

      - name: Health check
        run: |
          sleep 8
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://donot.cl/api/health > /dev/null; then
              echo "✅  Health OK"
              exit 0
            fi
            sleep 8
          done
          exit 1
