name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_PORT: '65002' # Hostinger usa 65002, no 22

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: id
        run: echo "release_id=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (standalone)
        run: npm run build
        env:
          # Placeholder solo para que Prisma client se construya. Las pages
          # son force-dynamic, así que no se ejecutan queries en build.
          DATABASE_URL: mysql://build:build@localhost:9999/build

      - name: Empaquetar release (tar.gz)
        env:
          REL: ${{ steps.id.outputs.release_id }}
        run: |
          mkdir -p out
          tar -czf "out/${REL}.tar.gz" \
            .next \
            public \
            prisma \
            deploy \
            ecosystem.config.js \
            package.json \
            package-lock.json
          ls -lh out/

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} -H "$HOST" >> ~/.ssh/known_hosts

      - name: Subir + descomprimir release en el servidor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ steps.id.outputs.release_id }}
        run: |
          REMOTE_REL="\$HOME/donot-platform/releases/${REL}"
          ssh -p ${{ env.DEPLOY_PORT }} ${USER}@${HOST} "mkdir -p ${REMOTE_REL}"
          scp -P ${{ env.DEPLOY_PORT }} "out/${REL}.tar.gz" "${USER}@${HOST}:donot-platform/releases/${REL}.tar.gz"
          ssh -p ${{ env.DEPLOY_PORT }} ${USER}@${HOST} \
            "tar -xzf \$HOME/donot-platform/releases/${REL}.tar.gz -C \$HOME/donot-platform/releases/${REL}/ && rm \$HOME/donot-platform/releases/${REL}.tar.gz"

      - name: Activar release (migrate + symlink + pm2)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ steps.id.outputs.release_id }}
        run: |
          ssh -p ${{ env.DEPLOY_PORT }} ${USER}@${HOST} \
            "bash \$HOME/donot-platform/releases/${REL}/deploy/scripts/release.sh \$HOME/donot-platform/releases/${REL}"

      - name: Health check post-deploy
        run: |
          sleep 8
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://donot.cl/api/health > /dev/null; then
              echo "✅  Health OK"
              exit 0
            fi
            echo "Esperando health check ($i/6)…"
            sleep 8
          done
          echo "❌  Health check falló tras deploy"
          exit 1
