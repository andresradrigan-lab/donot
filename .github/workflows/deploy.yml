name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_PORT: '65002' # Hostinger usa 65002, no 22

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.id.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - id: id
        run: echo "release_id=$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (standalone)
        run: npm run build

      - name: Empaquetar release
        run: |
          mkdir -p out/donot-platform
          cp -r .next out/donot-platform/.next
          cp -r public out/donot-platform/public
          cp -r prisma out/donot-platform/prisma
          cp -r deploy out/donot-platform/deploy
          cp ecosystem.config.js package.json package-lock.json out/donot-platform/

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/donot-platform
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} -H "$HOST" >> ~/.ssh/known_hosts

      - name: Subir release al servidor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ needs.build.outputs.release_id }}
        run: |
          ssh -p ${{ env.DEPLOY_PORT }} ${USER}@${HOST} "mkdir -p \$HOME/donot-platform/releases/${REL}"
          rsync -az --delete -e "ssh -p ${{ env.DEPLOY_PORT }}" \
            release/ ${USER}@${HOST}:donot-platform/releases/${REL}/

      - name: Activar release (migrate + symlink + pm2)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          REL: ${{ needs.build.outputs.release_id }}
        run: |
          ssh -p ${{ env.DEPLOY_PORT }} ${USER}@${HOST} \
            "bash \$HOME/donot-platform/releases/${REL}/deploy/scripts/release.sh \$HOME/donot-platform/releases/${REL}"

      - name: Health check post-deploy
        run: |
          sleep 8
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://donot.cl/api/health > /dev/null; then
              echo "✅  Health OK"
              exit 0
            fi
            echo "Esperando health check ($i/6)…"
            sleep 8
          done
          echo "❌  Health check falló tras deploy"
          exit 1
